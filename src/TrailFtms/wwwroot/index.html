<!DOCTYPE html>
<html lang="fr" class="scroll-win-10">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrailFtms</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/BlazorWinOld/css/blazorwinold.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="TrailFtms.styles.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Une erreur inattendue s'est produite.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // French by default. Declared at startup so that Blazor loads the matching ICU data
        // (changing the culture later from C# is rejected without loading all globalization data).
        Blazor.start({ applicationCulture: "fr-FR" });
    </script>
</body>

</html>
